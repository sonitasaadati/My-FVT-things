<!DOCTYPE html>
<html lang="en">
    <head>
        <title>S.IT</title>
        <style>
            body {
                background-color: lavender;
                font-family: Arial, sans-serif;
                text-align: center;
            }
            .box {
                background-color: white;
                width: 400px;
                margin: 80px auto;
                padding: 30px;
                border: 3px solid purple;
                border-radius: 20px;
            }
            h1 {
                color: purple;
                font-size: 24px;
                white-space: nowrap;
            }
            p {
                color: gray;
                font-size: 18px;
            }
            button {
                background-color: plum;
                color: white;
                padding: 12px 25px;
                margin: 10px;
                border: none;
                border-radius: 12px;
                font-size: 16px;
            }
            button:hover {
                background-color: pink;
            }
        </style>

        <body>
            <div class=box">
                <h1>My Favorite Music🎀</h1>
                <p>Shadmehr Aghili - Setareh</p>
                <audio controls>
                    <source src="Shadmehr Aghili - Setareh.mp3" type="audio/mpeg">
                </audio>

                <p>Amir Tataloo - Baghalam Kon</p>
                <audio controls>
                    <source src="Amir Tataloo - Baghalam Kon.mp3" type="audio/mpeg">
                </audio>

                <br>
                <a href="index.html">
                    <button>🙋‍♀️Back To Home</button>
                </a>
            </div>
        </body>
</html>
